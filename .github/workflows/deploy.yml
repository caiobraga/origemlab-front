# Static site: npm build → aws s3 sync → optional CloudFront invalidation.
#
# GitHub Variables: AWS_REGION, AWS_ROLE_ARN (OIDC deploy role), S3_BUCKET,
# optional CLOUDFRONT_DISTRIBUTION_ID.
#
# IAM (GitHub Actions): anexar .github/aws-iam-deploy-role-policy.json à ROLE OIDC
# (IAM → Roles → sua role → Permissões → JSON). NÃO colar essa política em “Bucket policy”.
#
# Política no BUCKET (não confundir com IAM da role de deploy):
# - Leitura pública liberal (GetObject + ListBucket para qualquer um): ver
#   aws-s3-bucket-policy-static-site-example.json (placeholder) ou
#   aws-s3-bucket-policy-public-liberal-origemlab-front.json (bucket origemlab-front).
#   No S3 → Permissions → Block public access → Edit → desativar as opções que bloqueiam
#   políticas públicas e ACLs públicas (risco: bucket listável e objetos legíveis sem auth).
# - CloudFront + OAC: aws-s3-bucket-policy-cloudfront-oac-example.json (sem Principal *).
#
# URL https://bucket.s3.region.amazonaws.com/ mostra XML na raiz — é o endpoint REST do S3,
# não serve index.html em /. Usa /index.html ou, melhor, CloudFront com Default root object
# = index.html e (SPA) Custom error responses 403/404 → /index.html com 200.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: origemlab-front-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}

      - name: Install + build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_OAUTH_PORTAL_URL: ${{ vars.VITE_OAUTH_PORTAL_URL }}
          VITE_APP_ID: ${{ vars.VITE_APP_ID }}
        run: |
          if [ -f package-lock.json ] || [ -f package.json ]; then
            npm ci
            npm run build
          else
            echo "origemlab-front: sem package.json; abort."
            exit 1
          fi

      - name: Upload to S3
        run: |
          aws s3 sync dist "s3://${S3_BUCKET}" --delete

      - name: Invalidate CloudFront
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"

